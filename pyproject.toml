[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whale-ying-memory"
version = "0.1.0"
description = "Structured long-term memory for AI agents: extraction, conflict resolution, hybrid retrieval, and multi-hop answering."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Jianying Huang", email = "jing-ying-dev@users.noreply.github.com" },
]
keywords = ["agent-memory", "long-term-memory", "conflict-resolution", "multi-hop", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rank-bm25",
    "sentence-transformers",
    "python-dotenv",
    "dateparser",
    "openai",
]

[project.scripts]
whaleying = "whaleying.standalone:main"

[project.urls]
Homepage = "https://github.com/jing-ying-dev/whale-ying-memory"
"Bug Tracker" = "https://github.com/jing-ying-dev/whale-ying-memory/issues"

[tool.setuptools]
packages = ["whaleying"]
